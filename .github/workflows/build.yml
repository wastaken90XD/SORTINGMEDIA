name: Magnus Android CI

on:
  push:
    branches:
      - main
      - "arena/**"
      - "m[0-9]/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

concurrency:
  group: magnus-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Accept Android licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Gradle 7.5
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: "7.5"
          cache-disabled: true

      - name: Check repository whitespace
        run: git diff --check

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Print build failure details
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            tail -n 160 build.log
            grep -iE "error:|what went wrong|execution failed|cannot find|cannot be applied|failed" build.log | head -n 80 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            tail -n 80 build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Upload Magnus APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Magnus-APK-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Magnus-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
